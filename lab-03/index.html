<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auroras NOAA · Tierra 3D</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="project-header">
      <p class="eyebrow">COMPUTACIÓN AVANZADA · MCD UAI</p>
      <h1>Auroras NOAA</h1>
      <p class="subtitle">La Tierra como soporte para visualizar datos públicos de actividad auroral.</p>
    </header>
    <div id="viewport" aria-label="Globo terrestre tridimensional interactivo"></div>
    <div class="view-divider" aria-hidden="true"></div>
    <span class="view-label view-label--global">ESCALA GLOBAL</span>
    <span class="view-label view-label--immersive">VISTA INMERSIVA</span>
    <aside class="data-card">
      <span class="status-dot" aria-hidden="true"></span>
      <div>
        <strong>NOAA Space Weather</strong>
        <p>Datos OVATION más recientes cargados en la consola.</p>
      </div>
    </aside>
    <p class="hint">Arrastra para rotar · Rueda para acercar</p>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
